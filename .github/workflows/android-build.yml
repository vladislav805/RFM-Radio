name: Android Build

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version matching app/build.gradle, for example 0.9.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Resolve release version
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="${INPUT_VERSION}"
          fi
          if [[ ! "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release version in major.minor.patch format" >&2
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=v${VERSION_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;29.0.14033849

      - name: Build debug APK and run unit tests
        if: steps.release.outputs.tag_name == ''
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Build release APK and run unit tests
        if: steps.release.outputs.tag_name != ''
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/android-release.keystore
        run: |
          if [[ -n "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]]; then
            umask 077
            printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${ANDROID_RELEASE_KEYSTORE_PATH}"
          fi
          bash ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:testDebugUnitTest

      - name: Remove release keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/android-release.keystore"

      - name: Verify release APK version
        if: steps.release.outputs.tag_name != ''
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version_name }}
        run: |
          if ! jq -e --arg expected "${EXPECTED_VERSION}" \
            '.elements | length > 0 and all(.[]; .versionName == $expected)' \
            app/build/outputs/apk/release/output-metadata.json >/dev/null; then
            echo "APK version does not match requested release ${EXPECTED_VERSION}" >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ steps.release.outputs.tag_name != '' && 'release' || 'debug' }}-apk
          path: app/build/outputs/apk/${{ steps.release.outputs.tag_name != '' && 'release' || 'debug' }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish draft release
        if: steps.release.outputs.tag_name != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: ${{ steps.release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/*.apk
